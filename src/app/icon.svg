<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" role="img" aria-label="Nifty Needle">
  <rect width="100" height="100" rx="24" fill="#22385c" />
  <g fill="none" stroke="#f7f5ef" stroke-width="7" stroke-linecap="round" stroke-linejoin="round">
    <!-- yarn loop -->
    <path d="M30 66 q-14 -12 -2 -27 q12 -15 27 -5" />
    <!-- needle -->
    <line x1="55" y1="30" x2="72" y2="74" />
  </g>
  <!-- needle eye / yarn tip -->
  <circle cx="55" cy="30" r="5.5" fill="#f7f5ef" />
</svg>
